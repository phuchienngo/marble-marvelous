-keepattributes RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations,AnnotationDefault,Signature,InnerClasses,EnclosingMethod

# Android instantiates these entry points from the manifest.
-keep class com.phuchienngo.marblemarvelous.MarbleApplication { *; }
-keep class com.phuchienngo.marblemarvelous.filament.FilamentWallpaperService { *; }
-keep class com.phuchienngo.marblemarvelous.permissions.PermissionsActivity { *; }
-keep class com.phuchienngo.marblemarvelous.Hilt_* { *; }

# Preserve names used by JNI registration while still allowing unused classes to be removed.
-keepclasseswithmembernames,includedescriptorclasses class * {
    native <methods>;
}
