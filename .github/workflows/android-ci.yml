name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Bazel
        uses: bazelbuild/setup-bazelisk@v3
        with:
          bazelisk-version: "1.20.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      # Platform-based Android builds (--android_platforms) resolve a CC toolchain
      # for os:android, provided by rules_android_ndk from a local NDK. Install it
      # and expose ANDROID_NDK_HOME (read by the android_ndk_repository extension).
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # debug.keystore is gitignored (it holds the developer's local debug cert),
      # so a fresh CI checkout has none. android_binary's debug_signing_keys needs
      # a keystore to sign //:app, so generate a throwaway one with the standard
      # Android debug parameters. This only verifies the build packages/signs; the
      # cert does not need to match the local one for CI.
      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: |
          bazel test //:app_test \
            --action_env=JAVA_HOME \
            --java_runtime_version=17 \
            --tool_java_runtime_version=17 \
            --experimental_enable_android_migration_apis=true

      - name: Build release APK
        run: |
          bazel build //:app \
            --action_env=JAVA_HOME \
            --java_runtime_version=17 \
            --tool_java_runtime_version=17 \
            --experimental_enable_android_migration_apis=true \
            --compilation_mode=opt

