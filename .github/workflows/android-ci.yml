name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Bazel
        uses: bazelbuild/setup-bazelisk@v3
        with:
          bazelisk-version: "1.20.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate user.bazelrc
        run: |
          cat > user.bazelrc <<EOF
          build --repo_env=ANDROID_HOME=$ANDROID_SDK_ROOT
          build --repo_env=ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          build --action_env=JAVA_HOME=$JAVA_HOME
          build --action_env=OPENWEATHER_API_KEY=dummy_openweather_key_for_ci
          EOF

      - name: Run unit tests
        run: bazel test //:app_test

      - name: Build release APK
        run: bazel build //:app --compilation_mode=opt
