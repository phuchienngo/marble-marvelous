# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AGP / AndroidX
# App predates AndroidX and imports android.support.* directly.
android.useAndroidX=true

# Decompiled output uses non-final resource IDs from aapt; keep R fields non-final.
android.nonFinalResIds=true

# KSP is not yet compatible with AGP 9's built-in Kotlin (verified: enabling it
# fails kspDebugKotlin with "KSP is not compatible with ... built-in Kotlin"),
# so keep the standalone Kotlin Android plugin (applied in app/build.gradle.kts)
# driving compilation. That plugin in turn needs AGP's legacy DSL, hence both
# opt-outs below. Each produces a deprecation warning at build time (expected —
# these are the officially documented workaround, see the AGP 9.0 release notes:
# https://developer.android.com/build/releases/agp-9-0-0-release-notes).
# Google's stated deadline: both opt-outs are removed in AGP 10.0 (mid-2026).
# Drop both flags (and the standalone Kotlin plugin) once KSP ships a release
# that supports android.builtInKotlin=true.
android.builtInKotlin=false
android.newDsl=false

# Run the Kotlin compiler in the Gradle JVM (avoids trying to provision a
# JetBrains JDK toolchain, which has no download for macOS aarch64).
kotlin.compiler.execution.strategy=in-process
org.gradle.java.installations.auto-download=false

# Use standard OpenJDK 21 (GraalVM jlink fails AGP 9 JdkImageTransform).
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home
